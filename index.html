<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ziqi Zhu — Curriculum Vitae</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f6f8fa;
    color: #1f2328;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid #d1d9e0;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 14px; color: #59636e; margin-top: 2px; }
  .actions a {
    display: inline-block;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 6px;
    margin-left: 8px;
  }
  .btn-primary { background: #1f883d; color: #fff; }
  .btn-primary:hover { background: #1a7f37; }
  .btn-secondary { background: #f6f8fa; color: #1f2328; border: 1px solid #d1d9e0; }
  .btn-secondary:hover { background: #eff1f3; }
  main {
    flex: 1;
    padding: 24px 32px;
    display: flex;
    justify-content: center;
  }
  .viewer {
    width: 100%;
    max-width: 960px;
    background: #fff;
    border: 1px solid #d1d9e0;
    border-radius: 8px;
    overflow: hidden;
  }
  .viewer iframe {
    width: 100%;
    height: calc(100vh - 160px);
    min-height: 600px;
    border: none;
    display: block;
  }
  footer {
    text-align: center;
    padding: 16px;
    font-size: 13px;
    color: #59636e;
  }
  footer a { color: #0969da; text-decoration: none; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Ziqi Zhu</h1>
      <p>Curriculum Vitae</p>
    </div>
    <div class="actions">
      <a class="btn-secondary" href="https://github.com/ZiqiZhu-0428/CV">GitHub Repo</a>
      <a class="btn-primary" href="CV_ZiqiZhu.pdf" download>Download PDF</a>
    </div>
  </header>
  <main>
    <div class="viewer">
      <iframe src="CV_ZiqiZhu.pdf" title="Curriculum Vitae of Ziqi Zhu"></iframe>
    </div>
  </main>
  <footer>
    Hosted with <a href="https://pages.github.com/">GitHub Pages</a>
  </footer>
</body>
</html>
